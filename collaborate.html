<header class="page-header">
  <div class="eyebrow">// collaborate</div>
  <h1>Let's talk about what you're building.</h1>
  <p>Brand, sponsorship, or a product that needs building — tell me what's going on and I'll tell you honestly whether it's a fit.</p>
</header>

<section class="editorial tight">
  <form class="collab-form" onsubmit="event.preventDefault(); alert('Form is static for now \u2014 wire this to an email service or Supabase table once ready.');">
    <div>
      <label>Name</label>
      <input type="text" required>
    </div>
    <div>
      <label>Email</label>
      <input type="email" required>
    </div>
    <div>
      <label>What kind of collaboration?</label>
      <select>
        <option>PR & Sponsorship</option>
        <option>Web Development</option>
        <option>Brand Strategy</option>
        <option>Something else</option>
      </select>
    </div>
    <div>
      <label>Tell me about it</label>
      <textarea rows="5" required></textarea>
    </div>
    <button type="submit"><i data-lucide="send"></i> Send</button>
  </form>
</section>
